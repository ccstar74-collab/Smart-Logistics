server:
  port: 18080
  address: 0.0.0.0

spring:
  application:
    name: smart-logistics-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_logistics?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:20060623nytstc}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expires-seconds: ${JWT_EXPIRES_SECONDS:28800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://172.28.48.1:5173}
  realtime:
    gps-merge-tolerance: ${GPS_MERGE_TOLERANCE:PT1S}
    latest-lookback: ${GPS_LATEST_LOOKBACK:PT24H}
    online-threshold: ${GPS_ONLINE_THRESHOLD:PT2M}
  geofence:
    arrival-radius-meters: ${ARRIVAL_GEOFENCE_RADIUS_METERS:200}
  realtime-anomaly:
    enabled: ${REALTIME_ANOMALY_ENABLED:true}
    deviation-threshold-meters: ${ANOMALY_DEVIATION_THRESHOLD_METERS:100}
    deviation-recovery-meters: ${ANOMALY_DEVIATION_RECOVERY_METERS:60}
    deviation-duration: ${ANOMALY_DEVIATION_DURATION:PT30S}
    stop-speed-threshold-kmh: ${ANOMALY_STOP_SPEED_THRESHOLD_KMH:1}
    stop-radius-meters: ${ANOMALY_STOP_RADIUS_METERS:20}
    stop-duration: ${ANOMALY_STOP_DURATION:PT2M}
    destination-guard-meters: ${ANOMALY_DESTINATION_GUARD_METERS:100}
  eta:
    enabled: ${ETA_ENABLED:false}
    gps-max-age: ${ETA_GPS_MAX_AGE:PT2M}
    speed-history-window: ${ETA_SPEED_HISTORY_WINDOW:PT10M}
    min-change: ${ETA_MIN_CHANGE:PT0S}
    force-persist-interval: ${ETA_FORCE_PERSIST_INTERVAL:PT1S}
    initial-delay-ms: ${ETA_INITIAL_DELAY_MS:1000}
    refresh-delay-ms: ${ETA_REFRESH_DELAY_MS:1000}
    amap:
      key: ${AMAP_WEB_SERVICE_KEY:}
      endpoint: ${AMAP_ROUTE_ENDPOINT:https://restapi.amap.com/v3/direction/driving}
      request-timeout: ${AMAP_REQUEST_TIMEOUT:PT5S}
  weather:
    amap:
      key: ${AMAP_WEB_SERVICE_KEY:}
      regeo-endpoint: ${AMAP_REGEO_ENDPOINT:https://restapi.amap.com/v3/geocode/regeo}
      weather-endpoint: ${AMAP_WEATHER_ENDPOINT:https://restapi.amap.com/v3/weather/weatherInfo}
      request-timeout: ${AMAP_REQUEST_TIMEOUT:PT5S}

# ============MQTT、InfluxDB配置============
mqtt:
  enabled: true
  realtime-enabled: true
  broker: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
  client-id: ${MQTT_CLIENT_ID:smart_logistics_sub}
  clientId.pub: ${MQTT_PUB_CLIENT_ID:smart_logistics_pub}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}

influxdb2:
  url: ${INFLUXDB_URL:http://127.0.0.1:8086}
  token: ${INFLUXDB_TOKEN:yzHnHcCg7ptAo8InfxQZ48bwJ8SRiBUU0x3hCTc-iEN3FM1joYgYobbNQF0e5lH1WiMIeX3hVAxGDmADy15u-w==}
  org: ${INFLUXDB_ORG:smart_logistics}
  bucket: ${INFLUXDB_BUCKET:gps_track}
