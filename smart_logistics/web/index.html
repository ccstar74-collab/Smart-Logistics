<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智慧物流助手</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f9;
      --panel: #ffffff;
      --text: #182126;
      --muted: #68757d;
      --line: #e2e7ea;
      --brand: #176b5b;
      --brand-soft: #e8f4f1;
      --user: #176b5b;
      --error: #a33a32;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: min(820px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--panel);
      border-inline: 1px solid var(--line);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: .02em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #aab3b8;
    }

    .status.online .dot { background: #21a179; }
    .status.error .dot { background: var(--error); }

    .messages {
      overflow-y: auto;
      padding: 28px 22px 18px;
      scroll-behavior: smooth;
    }

    .empty {
      min-height: 100%;
      display: grid;
      place-content: center;
      text-align: center;
      color: var(--muted);
      padding: 32px;
    }

    .empty strong {
      color: var(--text);
      font-size: 20px;
      margin-bottom: 8px;
    }

    .message {
      display: flex;
      margin-bottom: 20px;
    }

    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: min(680px, 88%);
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.68;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .assistant .bubble {
      background: #f0f3f4;
      border-bottom-left-radius: 5px;
    }

    .user .bubble {
      color: #fff;
      background: var(--user);
      border-bottom-right-radius: 5px;
    }

    .meta {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .error-text { color: var(--error); }

    footer {
      padding: 12px 18px 18px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 9px 9px 9px 14px;
      border: 1px solid #ccd5d9;
      border-radius: 17px;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }

    .composer:focus-within {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }

    textarea {
      width: 100%;
      min-height: 26px;
      max-height: 150px;
      padding: 3px 0;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font: inherit;
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font: inherit;
    }

    .send {
      min-width: 66px;
      height: 38px;
      color: #fff;
      background: var(--brand);
      font-weight: 600;
    }

    .send:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .clear {
      padding: 5px 7px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
    }

    .hint {
      display: flex;
      justify-content: space-between;
      padding: 7px 3px 0;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 640px) {
      .app { border: 0; }
      header { padding: 15px 16px; }
      .messages { padding: 22px 15px 12px; }
      footer { padding: 10px 12px 13px; }
      .status span:last-child { display: none; }
      .bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>智慧物流助手</h1>
      <div id="status" class="status" aria-live="polite">
        <span class="dot"></span>
        <span>正在连接</span>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty">
        <strong>有什么物流问题？</strong>
        <span>可以询问“渝A10000现在在哪”，或咨询轨迹、ETA 与异常告警。</span>
      </div>
    </section>

    <footer>
      <form id="form" class="composer">
        <textarea id="question" rows="1" maxlength="2000" placeholder="输入问题，Enter 发送" aria-label="输入问题"></textarea>
        <button id="send" class="send" type="submit" disabled>发送</button>
      </form>
      <div class="hint">
        <span>Shift + Enter 换行</span>
        <button id="clear" class="clear" type="button">清空对话</button>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      const messages = document.querySelector('#messages');
      const empty = document.querySelector('#empty');
      const form = document.querySelector('#form');
      const question = document.querySelector('#question');
      const send = document.querySelector('#send');
      const clear = document.querySelector('#clear');
      const status = document.querySelector('#status');
      let busy = false;

      const makeSessionId = () => {
        if (globalThis.crypto && crypto.randomUUID) return crypto.randomUUID();
        return `web-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      };

      let sessionId = localStorage.getItem('logistics-session-id') || makeSessionId();
      localStorage.setItem('logistics-session-id', sessionId);

      const setStatus = (kind, text) => {
        status.className = `status ${kind || ''}`;
        status.lastElementChild.textContent = text;
      };

      const scrollToBottom = () => {
        messages.scrollTop = messages.scrollHeight;
      };

      const appendMessage = (role, text, metadata) => {
        empty.hidden = true;
        const row = document.createElement('article');
        row.className = `message ${role}`;

        const content = document.createElement('div');
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        content.appendChild(bubble);

        if (metadata) {
          const meta = document.createElement('div');
          meta.className = `meta${metadata.error ? ' error-text' : ''}`;
          meta.textContent = metadata.text;
          content.appendChild(meta);
        }

        row.appendChild(content);
        messages.appendChild(row);
        scrollToBottom();
        return row;
      };

      const resizeInput = () => {
        question.style.height = 'auto';
        question.style.height = `${Math.min(question.scrollHeight, 150)}px`;
        send.disabled = busy || !question.value.trim();
      };

      const checkHealth = async () => {
        try {
          const response = await fetch('/health');
          if (!response.ok) throw new Error('服务不可用');
          const health = await response.json();
          const model = health.modelEnabled ? health.modelName : '本地检索';
          setStatus('online', `在线 · ${model}`);
        } catch (_) {
          setStatus('error', '服务离线');
        }
      };

      const sendQuestion = async () => {
        const text = question.value.trim();
        if (!text || busy) return;

        appendMessage('user', text);
        question.value = '';
        busy = true;
        resizeInput();
        setStatus('', '正在思考');

        const pending = appendMessage('assistant', '正在查询知识库并生成回答…');
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({ sessionId, question: text })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error?.message || `请求失败（HTTP ${response.status}）`);
          }

          pending.remove();
          const sourceNames = [...new Set((data.sources || []).map(item => item.source))];
          const meta = [`模式：${data.mode || 'unknown'}`];
          if (sourceNames.length) meta.push(`来源：${sourceNames.join('、')}`);
          appendMessage('assistant', data.answer || '智能体没有返回内容。', { text: meta.join(' · ') });
          await checkHealth();
        } catch (error) {
          pending.remove();
          appendMessage('assistant', '暂时无法完成这次回答。', {
            text: error.message || '未知错误',
            error: true
          });
          setStatus('error', '请求失败');
        } finally {
          busy = false;
          resizeInput();
          question.focus();
        }
      };

      question.addEventListener('input', resizeInput);
      question.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendQuestion();
        }
      });
      form.addEventListener('submit', event => {
        event.preventDefault();
        sendQuestion();
      });
      clear.addEventListener('click', () => {
        messages.querySelectorAll('.message').forEach(item => item.remove());
        empty.hidden = false;
        sessionId = makeSessionId();
        localStorage.setItem('logistics-session-id', sessionId);
        question.focus();
      });

      resizeInput();
      checkHealth();
      question.focus();
    })();
  </script>
</body>
</html>
